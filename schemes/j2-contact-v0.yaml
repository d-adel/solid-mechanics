    measurand: ref:d-adel/relative-slide-distance-error@0
    predicate: {operator: le, limit: 1.0e-2}
    quantifier: enumerated
    cases: [ref:d-adel/c1-incline-0@0, ref:d-adel/c1-incline-05@0]
